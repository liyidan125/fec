<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FE Credit Data Platform Due-Diligence · On-Screen (EN-first)</title>
<style>
  :root{
    --fs:1;
    --bg:#0a1120; --bg2:#0d1626;
    --panel:#121d33; --panel2:#18294a; --panel3:#1f3257;
    --line:#243759; --line2:#2e456e;
    --text:#eaf1fb; --muted:#8ea3c4; --faint:#647898;
    --accent:#4cc4ff; --accent2:#22d3ee; --accent-soft:rgba(76,196,255,.13);
    --gold:#ffc857; --gold-soft:rgba(255,200,87,.1);
    --rose:#ff7a93; --rose-soft:rgba(255,122,147,.1);
    --green:#46d6a6; --violet:#b794f6;
    --side-w:288px;
    --radius:14px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(76,196,255,.07), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(183,148,246,.06), transparent 60%),
      var(--bg);
    color:var(--text); overflow:hidden;
    font-size:calc(16px * var(--fs));
    -webkit-font-smoothing:antialiased;
  }
  .app{display:grid; grid-template-columns:var(--side-w) 1fr; height:100vh; transition:grid-template-columns .25s ease}
  body.collapsed{--side-w:0px}
  body.collapsed .sidebar{transform:translateX(-100%)}

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-right:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden; transition:transform .25s ease;
  }
  .brand{padding:18px 18px 14px; border-bottom:1px solid var(--line)}
  .brand .logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 12px var(--accent)}
  .brand h1{font-size:calc(14px * var(--fs));font-weight:700;letter-spacing:.3px;line-height:1.3}
  .brand .sub{font-size:calc(11px * var(--fs));color:var(--muted);margin-top:4px;line-height:1.5}
  .nav{flex:1; overflow-y:auto; padding:10px 10px; scrollbar-width:thin; scrollbar-color:var(--line2) transparent}
  .nav::-webkit-scrollbar{width:6px}
  .nav::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
  .nav-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
    padding:9px 11px; border-radius:10px; margin-bottom:3px; border:1px solid transparent;
    background:transparent; color:var(--muted); transition:all .15s ease; position:relative;
  }
  .nav-item:hover{background:var(--panel); color:var(--text)}
  .nav-item.active{background:var(--accent-soft); color:var(--text); border-color:rgba(76,196,255,.35)}
  .nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
  .nav-item .badge{flex:0 0 auto; min-width:34px; height:24px; padding:0 7px; border-radius:7px; background:var(--panel2); color:var(--faint); font-size:calc(11px * var(--fs)); font-weight:600; display:flex;align-items:center;justify-content:center}
  .nav-item.active .badge{background:var(--accent);color:#06243a}
  .nav-item .label{flex:1; font-size:calc(12.5px * var(--fs)); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .nav-item .status{flex:0 0 auto; width:9px;height:9px;border-radius:50%;background:var(--faint);opacity:.5}
  .nav-item .status.s1{background:var(--violet);opacity:1;box-shadow:0 0 8px var(--violet)}
  .nav-item .status.s2{background:var(--green);opacity:1;box-shadow:0 0 8px var(--green)}

  .tools{padding:12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px}
  .tool-row{display:flex; gap:6px}
  .btn{
    flex:1; cursor:pointer; border:1px solid var(--line2); background:var(--panel);
    color:var(--text); padding:8px 6px; border-radius:9px; font-size:calc(12px * var(--fs));
    font-family:inherit; transition:all .15s ease; display:flex;align-items:center;justify-content:center;gap:5px
  }
  .btn:hover{background:var(--panel2); border-color:var(--accent)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#06243a; border-color:transparent; font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger:hover{border-color:var(--rose); color:var(--rose)}

  /* ---------- Main ---------- */
  .content{display:flex; flex-direction:column; min-width:0; height:100vh}
  .topbar{
    display:flex; align-items:center; gap:14px; padding:14px 26px;
    border-bottom:1px solid var(--line); background:rgba(13,22,38,.6); backdrop-filter:blur(8px);
  }
  .topbar .toggle{cursor:pointer;border:1px solid var(--line2);background:var(--panel);color:var(--muted);width:38px;height:34px;border-radius:9px;font-size:15px;display:flex;align-items:center;justify-content:center}
  .topbar .toggle:hover{color:var(--accent);border-color:var(--accent)}
  .crumb{flex:1;min-width:0}
  .crumb .k{font-size:calc(12px * var(--fs));color:var(--faint);letter-spacing:.5px}
  .crumb .t{font-size:calc(15px * var(--fs));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .progress{display:flex;align-items:center;gap:10px}
  .progress .bar{width:120px;height:6px;border-radius:4px;background:var(--panel2);overflow:hidden}
  .progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .3s}
  .progress .num{font-size:calc(12px * var(--fs));color:var(--muted);font-variant-numeric:tabular-nums}
  .navbtn{cursor:pointer;border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:9px;font-size:calc(13px * var(--fs));font-family:inherit;transition:all .15s}
  .navbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .navbtn:disabled{opacity:.35;cursor:not-allowed}

  .view{flex:1; overflow-y:auto; padding:30px 44px 60px; scrollbar-width:thin; scrollbar-color:var(--line2) transparent}
  .view::-webkit-scrollbar{width:8px}
  .view::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  .view-wrap{max-width:1180px;margin:0 auto}

  .dim-head{margin-bottom:22px}
  .dim-no{display:inline-flex;align-items:center;gap:8px;font-size:calc(13px * var(--fs));color:var(--accent);font-weight:600;letter-spacing:.5px;margin-bottom:8px}
  .dim-no::before{content:"";width:24px;height:2px;background:var(--accent);border-radius:2px}
  .dim-title{font-size:calc(28px * var(--fs));font-weight:800;line-height:1.2;letter-spacing:.3px}
  .dim-title-sub{font-size:calc(15px * var(--fs));color:var(--muted);margin-top:6px;font-weight:400}

  .intent{
    display:flex; gap:14px; align-items:flex-start; margin:20px 0 26px;
    background:var(--gold-soft); border:1px solid rgba(255,200,87,.25); border-left:4px solid var(--gold);
    border-radius:10px; padding:15px 18px;
  }
  .intent .ic{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:rgba(255,200,87,.18);display:flex;align-items:center;justify-content:center;font-size:16px}
  .intent .body{flex:1;min-width:0}
  .intent .lab{font-size:calc(11px * var(--fs));color:var(--gold);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px}
  .intent .main{font-size:calc(14px * var(--fs));color:var(--text);line-height:1.6}
  .intent .sub{font-size:calc(12.5px * var(--fs));color:var(--muted);line-height:1.6;margin-top:4px}

  .qlist{display:flex;flex-direction:column;gap:13px}
  .q{
    display:grid; grid-template-columns:48px 1fr; gap:16px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:17px 20px; transition:all .18s ease;
  }
  .q:hover{border-color:var(--line2); background:var(--panel2); transform:translateY(-1px); box-shadow:var(--shadow)}
  .q .qn{
    width:42px;height:42px;border-radius:11px; background:linear-gradient(135deg,var(--accent-soft),transparent);
    border:1px solid rgba(76,196,255,.3); color:var(--accent); font-weight:700; font-size:calc(16px * var(--fs));
    display:flex;align-items:center;justify-content:center;
  }
  .q .qc{min-width:0}
  .q .q-main{font-size:calc(16px * var(--fs)); line-height:1.6; color:var(--text); font-weight:500}
  .q .q-sub{font-size:calc(13px * var(--fs)); line-height:1.65; color:var(--muted); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line)}
  .tag{display:inline-block;font-size:calc(11px * var(--fs));font-weight:700;padding:2px 8px;border-radius:6px;margin-right:7px;vertical-align:middle}
  .tag.risk{background:rgba(255,122,147,.15);color:var(--rose)}
  .tag.mkt{background:rgba(70,214,166,.15);color:var(--green)}
  .tag.col{background:rgba(183,148,246,.15);color:var(--violet)}
  .tag.ops{background:rgba(76,196,255,.15);color:var(--accent)}

  .hero{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:18px;padding:28px 30px;margin-bottom:24px}
  .hero h2{font-size:calc(23px * var(--fs));font-weight:800;margin-bottom:8px}
  .hero p{color:var(--muted);line-height:1.7;font-size:calc(14px * var(--fs))}
  .hero .pill{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-size:calc(12px * var(--fs));font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .card.warn{border-color:rgba(255,122,147,.3);background:var(--rose-soft)}
  .card.gold{border-color:rgba(255,200,87,.3)}
  .card h3{font-size:calc(14px * var(--fs));font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .card h3 .d{width:8px;height:8px;border-radius:50%}
  .card ul{list-style:none}
  .card li{font-size:calc(13px * var(--fs));color:var(--muted);line-height:1.75;padding-left:14px;position:relative}
  .card li::before{content:"";position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:var(--faint)}
  .card.warn li::before{background:var(--rose)}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:center}
  .stat .v{font-size:calc(22px * var(--fs));font-weight:800;color:var(--accent);line-height:1.1}
  .stat .l{font-size:calc(11px * var(--fs));color:var(--muted);margin-top:5px}
  .sec-title{font-size:calc(16px * var(--fs));font-weight:700;margin:8px 0 14px;display:flex;align-items:center;gap:9px}
  .sec-title::before{content:"";width:4px;height:18px;background:var(--accent);border-radius:3px}

  .tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:calc(13px * var(--fs));vertical-align:top}
  th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:calc(12px * var(--fs));letter-spacing:.3px;position:sticky;top:0}
  tr:last-child td{border-bottom:none}
  tr.fec-sep td{background:var(--rose-soft);color:var(--rose);font-weight:700;font-size:calc(11px * var(--fs));text-transform:uppercase;letter-spacing:1px}
  tr.fec-row td{background:rgba(255,122,147,.04)}
  td.edit{outline:none;border-radius:6px;min-width:120px}
  td.edit:focus{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
  td.edit:empty::before{content:"Click to note…";color:var(--faint);font-style:italic}
  .muted{color:var(--faint)}

  .open-q{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--violet);border-radius:12px;padding:18px 20px;margin-bottom:14px}
  .open-q .oq{font-size:calc(16px * var(--fs));font-weight:600;margin-bottom:4px}
  .open-q .oqe{font-size:calc(12.5px * var(--fs));color:var(--muted);margin-bottom:10px}
  .note{width:100%;min-height:60px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:11px 14px;color:var(--text);font-size:calc(14px * var(--fs));font-family:inherit;resize:vertical;outline:none;line-height:1.6}
  .note:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .note::placeholder{color:var(--faint)}

  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:calc(12px * var(--fs));color:var(--muted);margin-top:6px}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:50%}
  .hint{position:fixed;bottom:16px;right:20px;font-size:calc(11px * var(--fs));color:var(--faint);background:rgba(13,22,38,.8);padding:7px 12px;border-radius:8px;border:1px solid var(--line);backdrop-filter:blur(6px);pointer-events:none}
  kbd{background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;font-size:calc(10px * var(--fs));color:var(--text);font-family:inherit}

  @media (max-width:760px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:288px;z-index:50;box-shadow:var(--shadow)}
    body.collapsed .sidebar{transform:translateX(-100%)}
    .view{padding:20px 18px 60px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="dot"></span><h1>FE Credit Data Platform<br>Due-Diligence</h1></div>
      <div class="sub">Benchmarked vs. WeBank · Status Diagnosis<br>On-Screen Discussion Edition · 2026.06</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="tools">
      <div class="tool-row">
        <button class="btn" id="fontMinus" title="Smaller font">A−</button>
        <button class="btn" id="fontPlus" title="Larger font">A+</button>
        <button class="btn" id="fullscreen" title="Fullscreen">⛶ Full</button>
      </div>
      <div class="tool-row">
        <button class="btn primary" id="export">⬇ Export Notes</button>
        <button class="btn danger" id="clear" title="Clear all notes">Clear</button>
      </div>
    </div>
  </aside>

  <main class="content">
    <div class="topbar">
      <button class="toggle" id="toggleSide" title="Toggle sidebar">☰</button>
      <div class="crumb">
        <div class="k" id="crumbK">Overview</div>
        <div class="t" id="crumbT">Background &amp; Methodology</div>
      </div>
      <div class="progress">
        <div class="bar"><i id="progBar"></i></div>
        <span class="num" id="progNum">1 / 14</span>
      </div>
      <button class="navbtn" id="prev">← Prev</button>
      <button class="navbtn" id="next">Next →</button>
    </div>
    <div class="view"><div class="view-wrap" id="view"></div></div>
  </main>
</div>
<div class="hint">Navigate <kbd>←</kbd> <kbd>→</kbd> · Status <kbd>S</kbd> · Fullscreen <kbd>F</kbd></div>

<script>
/* ============ DATA (English-first; Chinese follows as supplement) ============ */
const dimensions = [
  {
    no:"Dimension 1", short:"D1 Strategy",
    title:"Data Strategy, Organization & Planning", titleSub:"数据战略、组织与规划",
    intent:{main:"Assess whether data work has top-down design, a dedicated team and sustained investment — or remains ad-hoc, request-driven and uncoordinated.", sub:"判断数据工作是否'有顶层设计、专职团队、持续投入'，还是'需求驱动、零散建设、无人统筹'。"},
    qs:[
      {en:"Does FE Credit have an explicit data strategy / data-middleware (中台) roadmap? Which function leads it (CDO / IT / Business)? Current headcount of the data team (developers, data engineers, analysts, data scientists)?", zh:"是否有明确的数据战略/数据中台规划？哪个部门牵头？数据团队当前规模（开发、数据工程、分析师、算法）？"},
      {en:"How are data demands generated and prioritized today — a 'project-based' model (business requests, IT fulfills) or a unified data-product roadmap?", zh:"数据需求如何产生与排期——业务提需求、IT 接单的'项目制'，还是有统一的数据产品规划？"},
      {en:"Major data-platform investments and systems built in the past 2–3 years? ROI of the largest ones (did the business actually adopt them)?", zh:"过去 2–3 年主要投入与建成的系统？最大几笔投入回报如何（业务方是否真正用起来）？"},
      {en:"Biggest frictions in data work today — budget, talent, cross-department collaboration, or business trust and willingness to use data?", zh:"当前数据工作最大阻力——预算、人才、跨部门协同，还是业务方的信任与使用意愿？"},
      {en:"Hard regulatory requirements (SBV — State Bank of Vietnam; personal-data protection) on governance / cross-border transfer / localization? Have they become a mandatory build driver?", zh:"监管（SBV、个人信息保护）对治理/出境/本地化有哪些硬性要求？是否已成为强制驱动力？"}
    ]
  },
  {
    no:"Dimension 2", short:"D2 Architecture & Data Lake",
    title:"Data Architecture, Warehouse Layering & Data Lake Status", titleSub:"数据架构、数仓分层与 Data Lake 现状",
    intent:{main:"Given FEC already has an AWS Data Lake, assess whether proper layering (ODS/DWD/DWS/ADS) and subject areas are built on top — or it has degenerated into a 'data swamp', source-direct with inconsistent definitions.", sub:"在已有 AWS Data Lake 前提下，判断其上是否建立规范分层与主题域，还是退化为'数据沼泽'、贴源直用、口径不一致。"},
    qs:[
      {en:"What data lives in the AWS Data Lake (App behavior logs, transactions, KYC, payments, service)? Formats (Parquet/ORC/JSON/CSV) and zone strategy (raw / curated / consumption)? Scale and growth? Has it become a 'data swamp' — lands only, no catalog, no governance?", zh:"Data Lake 存了哪些数据？格式与分区/分层策略？规模与增长？是否已退化为'数据沼泽'——只进不出、无目录、无治理？"},
      {en:"Is a warehouse layering (source-replica ODS → detail DWD → summary DWS → application ADS) built on top of the lake? Or still only a raw lake with no layered processing / normalized modeling? Is it actually enforced?", zh:"Data Lake 之上是否已建数仓分层（ODS→DWD→DWS→ADS）？还是仅有原始湖、无分层加工？是否真正执行？"},
      {en:"Sources and ingestion: how do AWS-platform data (CASA / Payment Hub / Middleware / App SDK logs) land in the lake? Is the on-prem VPB core data (T24 Core / OCB / CASA Platform) replicated into the lake? The on-prem→cloud link (frequency, method, CDC/batch, latency)?", zh:"AWS 平台数据如何入湖？VPB 本地核心数据（T24/OCB/CASA）是否同步入湖？跨数据中心→云集成链路如何？"},
      {en:"How are subject areas partitioned? Is the full credit lifecycle covered (acquisition, application, underwriting, disbursement, repayment, overdue, collections, service)? Are cross-product (cash loan / POS installment / motorcycle loan) definitions unified?", zh:"主题域如何划分？是否覆盖信贷全流程？跨产品口径是否统一？"},
      {en:"Is the same metric (outstanding balance / delinquency rate / approval rate) consistent across the cloud Data Lake, on-prem systems and reports? Which side is the source of truth? How are disputes arbitrated?", zh:"同一指标在云上 Data Lake、本地系统、各报表间口径是否一致？以哪侧为准？分歧如何仲裁？"}
    ]
  },
  {
    no:"Dimension 3", short:"D3 AWS Compute & Hybrid",
    title:"AWS Cloud Compute/Storage & Hybrid-Cloud Data Integration", titleSub:"AWS 云上计算/存储与混合云数据集成",
    intent:{main:"Assess whether storage and compute choices are sound, batch/real-time needs are met, and whether AWS-cloud ↔ on-prem(VPB DC) integration is smooth or has network/latency/consistency bottlenecks.", sub:"判断存储/计算选型是否合理、是否满足批量/实时，以及云↔本地集成是否顺畅或存在网络/延迟/一致性瓶颈。"},
    qs:[
      {en:"Which AWS services are used for storage and compute? Storage (S3 + Lake Formation?), batch ETL (EMR / Glue?), ad-hoc query (Athena?), cloud warehouse (Redshift?), real-time (Kinesis / MSK / Flink on EMR?), orchestration (Step Functions / MWAA?)? Clear rationale and architecture governance?", zh:"存储与计算分别用了哪些 AWS 服务（S3/EMR/Glue/Athena/Redshift/Kinesis/MWAA）？是否有明确选型理由与架构治理？"},

/* ============ STATE / STORAGE ============ */
const LS = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){return def;} },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let status = LS.get("fec-en-status", {});
let notes  = LS.get("fec-en-notes", {});
let cur = 0;

/* ============ RENDER ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function renderNav(){
  const nav = $("#nav");
  nav.innerHTML = sections.map((s,i)=>{
    const st = s.type==="dimension" ? status[s.dim] : null;
    const stCls = st?` s${st}`:"";
    const badge = s.type==="overview"?"◎":(s.type==="dimension"?s.nav.split(" ")[0]:(s.type==="benchmark"?"∑":"✦"));
    return `<button class="nav-item ${i===cur?'active':''}" data-i="${i}">
      <span class="badge">${badge}</span>
      <span class="label">${esc(s.nav)}</span>
      ${s.type==="dimension"?`<span class="status${stCls}" data-st="${i}" title="Click to cycle status"></span>`:""}
    </button>`;
  }).join("");
  nav.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>go(+b.dataset.i));
  nav.querySelectorAll(".status").forEach(b=>b.onclick=e=>{e.stopPropagation(); cycleStatus(sections[+b.dataset.st].dim);});
}

function renderView(){
  const s = sections[cur];
  const v = $("#view");
  $("#crumbK").textContent = s.nav;
  $("#progBar").style.width = ((cur+1)/sections.length*100)+"%";
  $("#progNum").textContent = `${cur+1} / ${sections.length}`;
  $("#prev").disabled = cur===0;
  $("#next").disabled = cur===sections.length-1;

  if(s.type==="overview"){ v.innerHTML = overviewHtml(); $("#crumbT").textContent="Background & Methodology"; }
  else if(s.type==="dimension"){ v.innerHTML = dimHtml(dimensions[s.dim]); $("#crumbT").textContent=dimensions[s.dim].short; }
  else if(s.type==="benchmark"){ v.innerHTML = benchHtml(); $("#crumbT").textContent="Key Quantitative Benchmark"; bindEdit(); }
  else if(s.type==="wrapup"){ v.innerHTML = wrapHtml(); $("#crumbT").textContent="Open-ended Wrap-up"; bindEdit(); }
  $(".view").scrollTop=0;
}

      <h3><span class="d" style="background:var(--accent)"></span>Hybrid Architecture · Diagnostic Focus</h3>
      <ul>
        <li>Data Lake maturity (layering / data swamp)</li>
        <li>Cloud ↔ on-prem integration (CDC / Direct Connect)</li>
        <li>Region / cross-border / cloud cost (FinOps)</li>
      </ul>
    </div>
  </div>

  <div class="sec-title">WeBank Benchmark Baseline (reference, not target)</div>
  <div class="stat-grid">
    <div class="stat"><div class="v">10.5 PB</div><div class="l">Managed data / +75 TB daily</div></div>
    <div class="stat"><div class="v">3600+</div><div class="l">DWD core tables (DWS 1700+)</div></div>
    <div class="stat"><div class="v">9000+</div><div class="l">B-class assets (external sources)</div></div>
    <div class="stat"><div class="v">220+</div><div class="l">Low-code operators / graph</div></div>
    <div class="stat"><div class="v">≤15 days</div><div class="l">External source onboarding</div></div>
    <div class="stat"><div class="v">100k+</div><div class="l">Risk strategy input params</div></div>
  </div>

  <div class="legend" style="margin-top:26px">
    <span><i style="background:var(--faint)"></i>Pending</span>
    <span><i style="background:var(--violet)"></i>In progress (press <kbd>S</kbd>)</span>
    <span><i style="background:var(--green)"></i>Done</span>
  </div>`;
}

function dimHtml(d){
  const i = dimensions.indexOf(d);
  const st = status[i]||0;
  const stName = ["Pending","In progress","Done"][st];
  const qhtml = d.qs.map((q,n)=>`
    <div class="q">
      <div class="qn">${n+1}</div>
      <div class="qc">
        <div class="q-main">${q.tag?`<span class="tag ${q.tag.cls}">${q.tag.tx}</span>`:""}${esc(q.en)}</div>
        <div class="q-sub">${esc(q.zh)}</div>
      </div>
    </div>`).join("");
  return `
  <div class="dim-head">
    <div class="dim-no">${d.no}　<span style="color:var(--faint);font-weight:400">| Status: ${stName} (press <kbd>S</kbd> to cycle)</span></div>
    <div class="dim-title">${esc(d.title)}</div>
    <div class="dim-title-sub">${esc(d.titleSub)}</div>
  </div>
  <div class="intent">
    <div class="ic">◎</div>
    <div class="body">
      <div class="lab">Diagnostic Intent</div>
      <div class="main">${esc(d.intent.main)}</div>
      <div class="sub">${esc(d.intent.sub)}</div>
    </div>
  </div>
  <div class="qlist">${qhtml}</div>`;
}

function benchHtml(){
  let rows = benchmarkRows.map((r,n)=>{
    if(r.sep) return `<tr class="fec-sep"><td colspan="4">${esc(r.t)}</td></tr>`;
    const k="b_"+n, k2="bg_"+n;
    const cur=notes[k]||"", gap=notes[k2]||"";
    return `<tr class="${r.fec?'fec-row':''}">
      <td><b>${esc(r.k)}</b><br><span class="muted" style="font-size:calc(11px * var(--fs))">${esc(r.zh)}</span></td>
      <td>${r.fec?'<span class="muted">—</span>':esc(r.v)}</td>
      <td class="edit" contenteditable="true" data-k="${k}">${esc(cur)}</td>
      <td class="edit" contenteditable="true" data-k="${k2}">${esc(gap)}</td>
    </tr>`;
  }).join("");
  return `
  <div class="dim-head">
    <div class="dim-no">Benchmark</div>
    <div class="dim-title">Key Quantitative Benchmark</div>
    <div class="dim-title-sub">关键量化对标速查表 — 现状列可点击现场记录（自动保存）</div>
  </div>
  <div class="tbl-wrap">
  <table>
    <thead><tr><th>Capability</th><th>WeBank Baseline</th><th>FEC Current</th><th>Gap / Maturity</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  </div>`;
}

function wrapHtml(){
  let qs = openQs.map((q,n)=>{
    const k="o_"+n, val=notes[k]||"";
    return `<div class="open-q">
      <div class="oq">Q${n+1}. ${esc(q.en)}</div>
      <div class="oqe">${esc(q.zh)}</div>
      <textarea class="note" data-k="${k}" placeholder="Record answers / key points here…">${esc(val)}</textarea>
    </div>`;
  }).join("");
  return `
  <div class="dim-head">
    <div class="dim-no">Wrap-up</div>
    <div class="dim-title">Open-ended Wrap-up Questions</div>
    <div class="dim-title-sub">开放性总结问题 — 记录区可现场输入并自动保存</div>
  </div>
  ${qs}
  <div class="legend" style="margin-top:18px"><span>💡 Click <b>Export Notes</b> (bottom-left) to generate a Markdown file after the discussion.</span></div>`;
}

function bindEdit(){
  document.querySelectorAll("[data-k]").forEach(el=>{
    el.addEventListener("input",()=>{
      notes[el.dataset.k] = el.tagName==="TEXTAREA"?el.value:el.innerText;
      LS.set("fec-en-notes", notes);
    });
  });
}

/* ============ INTERACTION ============ */
function go(i){ cur=Math.max(0,Math.min(sections.length-1,i)); renderNav(); renderView(); }
function cycleStatus(dim){ if(dim===undefined) return; status[dim]=((status[dim]||0)+1)%3; LS.set("fec-en-status",status); renderNav(); if(sections[cur].type==="dimension") renderView(); }
function setFont(d){ let f=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs"))||1; f=Math.max(.85,Math.min(1.5,+(f+d).toFixed(2))); document.documentElement.style.setProperty("--fs",f); LS.set("fec-en-fs",f); }
function toggleFull(){ if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); } else { document.exitFullscreen?.(); } }
function toggleSide(){ document.body.classList.toggle("collapsed"); LS.set("fec-en-collapsed", document.body.classList.contains("collapsed")); }

function exportMD(){
  const stName=["Pending","In progress","Done"];
  let md=`# FE Credit Data Platform Due-Diligence — Discussion Notes\n\nExported: ${new Date().toLocaleString()}\n\n`;
  md+=`## Progress\n\n`;
  dimensions.forEach((d,i)=>{ if(status[i]) md+=`- ${d.no} ${d.title} — **${stName[status[i]]}**\n`; });
  md+=`\n## Key Quantitative Benchmark\n\n| Capability | WeBank Baseline | FEC Current | Gap / Maturity |\n|---|---|---|---|\n`;
  benchmarkRows.forEach((r,n)=>{ if(r.sep){md+=`\n**${r.t}**\n\n| Capability | WeBank Baseline | FEC Current | Gap / Maturity |\n|---|---|---|---|\n`; return;} md+=`| ${r.k} (${r.zh}) | ${r.fec?"—":r.v} | ${(notes["b_"+n]||"").replace(/\|/g,"/")} | ${(notes["bg_"+n]||"").replace(/\|/g,"/")} |\n`; });
  md+=`\n## Open-ended Wrap-up\n\n`;
  openQs.forEach((q,n)=>{ md+=`### Q${n+1}. ${q.en}\n> ${q.zh}\n\n${(notes["o_"+n]||"_not recorded_")}\n\n`; });
  const blob=new Blob([md],{type:"text/markdown;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`FEC_Data_Platform_Discussion_Notes_${new Date().toISOString().slice(0,10)}.md`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

function clearAll(){
  if(!confirm("Clear all discussion notes and status? This cannot be undone.")) return;
  status={}; notes={}; LS.del("fec-en-status"); LS.del("fec-en-notes");
  renderNav(); renderView();
}

/* ============ INIT ============ */
function init(){
  document.documentElement.style.setProperty("--fs", LS.get("fec-en-fs",1));
  if(LS.get("fec-en-collapsed",false)) document.body.classList.add("collapsed");
  renderNav(); renderView();
  $("#prev").onclick=()=>go(cur-1);
  $("#next").onclick=()=>go(cur+1);
  $("#toggleSide").onclick=toggleSide;
  $("#fontMinus").onclick=()=>setFont(-0.05);
  $("#fontPlus").onclick=()=>setFont(0.05);
  $("#fullscreen").onclick=toggleFull;
  $("#export").onclick=exportMD;
  $("#clear").onclick=clearAll;
  document.addEventListener("keydown",e=>{
    if(e.target.isContentEditable||e.target.tagName==="TEXTAREA") return;
    if(e.key==="ArrowLeft"){go(cur-1);}
    else if(e.key==="ArrowRight"){go(cur+1);}
    else if(e.key==="Home"){go(0);}
    else if(e.key==="End"){go(sections.length-1);}
    else if(e.key.toLowerCase()==="s"){ if(sections[cur].type==="dimension") cycleStatus(sections[cur].dim); }
    else if(e.key.toLowerCase()==="f"){ toggleFull(); }
  });
}
init();
</script>
</body>
</html>
